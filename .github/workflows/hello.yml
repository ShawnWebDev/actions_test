name: Jest Test

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Use marketplace actions
        uses: actions/checkout@v7
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install npm
        run: npm install
      - name: Run Test
        run: npm test || (echo "TESTS FAILED" && exit 1)