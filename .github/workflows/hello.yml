name: Jest Test

on:
  push:
    branches:
      - dev
  pull-request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: npm install
      - run: npm test || (echo "TESTS FAILED" && exit 1)